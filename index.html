<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bass Hero</title>
    <!-- <script src="script.js" defer></script> -->
    <script type="module" src="js/main.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="display:none;">
        <img id="fogo" width="100" height="100" src="assets/fogo.png">
    </div>
      <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; gap: 30px; flex: 1">
        <div style="text-align: center;">
            <h1 style="color: #00ff41; font-size: 3.5em; margin: 0; text-shadow: 0 0 20px rgba(0, 255, 65, 0.7); letter-spacing: 3px; font-weight: 900;">BASS HERO</h1>
            <p id="instrucoes" style="color: #888; font-size: 12px; margin: 10px 0 0 0; letter-spacing: 1px;">Press a number to choose the song</p>
        </div>
          
        <div style="display: flex; align-items: center; gap: 15px; background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 8px; border: 1px solid rgba(0, 255, 65, 0.3);">
            <label for="volumeControl" style="color: #00ff41; font-weight: bold; font-size: 14px;">VOLUME:</label>
            <input type="range" id="volumeControl" min="0" max="100" value="50" style="width: 150px; cursor: pointer; accent-color: #00ff41;">
            <span id="volumeValue" style="color: #00ff41; width: 40px; font-weight: bold;">50%</span>
        </div>
        
        <canvas id="myCanvas" width="340" height="750" style="border: 2px solid #00ff41; background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%); box-shadow: 0 0 30px rgba(0, 255, 65, 0.3); border-radius: 4px;"></canvas>
        
        <p id="pontuacao" style="color: #00ff41; font-size: 24px; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);">SCORE: 0</p>
    </div>
    
    <footer>
        Made with ❤️ by Drogas
    </footer>
</body>
</html>
